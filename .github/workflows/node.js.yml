name: Node.js CI

on:
  pull_request:
    branches: ["main", "test", "develop"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Build Docker image
        run: docker build -t stage-drive-frontend:ci .

      # Catches a broken nginx config, which a successful build alone does not.
      - name: Smoke test image
        run: |
          docker run -d --name ci-smoke -p 8080:80 stage-drive-frontend:ci
          for i in $(seq 1 15); do
            curl -fsS -o /dev/null http://localhost:8080/ && break || sleep 2
          done
          curl -fsS -o /dev/null -w 'index         %{http_code}\n' http://localhost:8080/
          curl -fsS -o /dev/null -w 'spa fallback  %{http_code}\n' http://localhost:8080/dashboard

      - name: Container logs on failure
        if: failure()
        run: docker logs ci-smoke || true
