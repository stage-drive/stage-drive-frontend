# Deploy stack: images come from Docker Hub, nothing is built here.
# Environments differ only by the .env file next to this compose.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-stage_drive}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    command: ["migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stage_drive}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stage_drive}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Same origin, so both redirects derive from PUBLIC_URL.
      GOOGLE_REDIRECT_URI: ${PUBLIC_URL}/api/auth/google/callback
      GOOGLE_OAUTH_SUCCESS_REDIRECT: ${PUBLIC_URL}
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # No published port: only nginx reaches the backend, over the compose network.

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:3000}
      DNS_RESOLVER: ${DNS_RESOLVER:-127.0.0.11}
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
