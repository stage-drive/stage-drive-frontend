# Docker DNS: start even if backend is down, re-resolve it after restarts.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend caps images at 2MB; leave room for multipart overhead.
    client_max_body_size 4m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Variable in proxy_pass forces runtime DNS resolution.
    location /api/ {
        set $backend http://backend:3000;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend-served uploads; DB stores paths like /uploads/avatars/<id>.png.
    location /uploads/ {
        set $backend_uploads http://backend:3000;
        proxy_pass $backend_uploads;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite asset filenames are hashed.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback for react-router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
